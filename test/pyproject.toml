[project]
name = "endstone-greenmoon-panel"
version = "5.1.1"
description = "GreenMoon面板：一个用来高效管理服务器的面板"
dependencies = ["endstone"]
requires-python = ">=3.11"

# endstone 插件入口（加载名须等于发行名去掉 endstone- 前缀）
[project.entry-points."endstone"]
greenmoon-panel = "admin_web.plugin:GreenMoonPlugin"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# 只打包 admin_web 包及其前端静态资源
[tool.setuptools.packages.find]
where = ["."]
include = ["admin_web*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
admin_web = ["static/*"]
